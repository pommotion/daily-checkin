name: daily-checkin

on:
  schedule:
    # 每天北京时间早上 08:11（UTC 00:11）——ListenHub 每天 8 点刷新签到，
    # 之后跑才能拿到当日份；GitHub schedule 常有 3-15 分钟延迟
    - cron: '11 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # 需要写权限把 state.json 提交回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        env:
          # ===== 站点 Secret（curl_bash 整段）=====
          HITUN_CURL_BASH: ${{ secrets.HITUN_CURL_BASH }}
          # RENZHE_EMAIL: ${{ secrets.RENZHE_EMAIL }}
          # RENZHE_PASSWD: ${{ secrets.RENZHE_PASSWD }}
          LISTENHUB_FREE_CURL_BASH: ${{ secrets.LISTENHUB_FREE_CURL_BASH }}
          LISTENHUB_PRO_CURL_BASH: ${{ secrets.LISTENHUB_PRO_CURL_BASH }}
          # IDKEY_CURL_BASH: ${{ secrets.IDKEY_CURL_BASH }}  # CF 拦截，已移除
          # ===== Moss API 每日登录（SSO 静默重放领 100 积分）=====
          MOSS_REFRESH_TOKEN: ${{ secrets.MOSS_REFRESH_TOKEN }}
          MOSS_RT_ENC_KEY: ${{ secrets.MOSS_RT_ENC_KEY }}  # state.json 里轮换 refresh_token 的 AES-GCM 加密 key
          # ===== 推送配置 =====
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: |
          python main.py

      # 把 state.json 提交回仓库。
      # 双重作用:
      #   1. 保留跨天状态（连续失败计数、凭证首见日期）
      #   2. 保活 — 仓库每天有 commit，不会触发 GitHub「60 天无活动自动禁用 schedule」
      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "state 无变化，跳过提交" && exit 0
          git commit -m "chore: update state $(date -u +%Y-%m-%d)"
          git push

  # 第二道保险。
  # commit 保活靠 state.json 变化，万一某段时间 state 恰好一直不变（或 commit 步骤失败），
  # 这个 job 直接调 GitHub API 重置 60 天计时器，不依赖仓库有无新 commit。
  # 与 wxread 仓库用的是同一方案。
  keepalive:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: checkin
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
