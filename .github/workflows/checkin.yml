name: daily-checkin

on:
  schedule:
    # 每天北京时间凌晨 00:07（UTC 16:07）——Moss API 每天零点刷新，紧跟其后拿当日积分；
    # GitHub schedule 常有延迟（高峰期实测可到 3 小时左右，只会迟到不会早到）
    - cron: '7 16 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # 需要写权限把 state.json 提交回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        env:
          # ===== 站点 Secret（curl_bash 整段）=====
          HITUN_CURL_BASH: ${{ secrets.HITUN_CURL_BASH }}
          # RENZHE_EMAIL: ${{ secrets.RENZHE_EMAIL }}
          # RENZHE_PASSWD: ${{ secrets.RENZHE_PASSWD }}
          LISTENHUB_FREE_CURL_BASH: ${{ secrets.LISTENHUB_FREE_CURL_BASH }}
          LISTENHUB_PRO_CURL_BASH: ${{ secrets.LISTENHUB_PRO_CURL_BASH }}
          # IDKEY_CURL_BASH: ${{ secrets.IDKEY_CURL_BASH }}  # CF 拦截，已移除
          # ===== Moss API 每日登录（SSO 静默重放领 100 积分）=====
          MOSS_REFRESH_TOKEN: ${{ secrets.MOSS_REFRESH_TOKEN }}
          MOSS_RT_ENC_KEY: ${{ secrets.MOSS_RT_ENC_KEY }}  # state.json 里轮换 refresh_token 的 AES-GCM 加密 key
          # ===== 凭证式新站点（JSON）=====
          LIBTV_CREDENTIALS: ${{ secrets.LIBTV_CREDENTIALS }}
          WORKBUDDY_CREDENTIALS: ${{ secrets.WORKBUDDY_CREDENTIALS }}
          MODELSCOPE_CREDENTIALS: ${{ secrets.MODELSCOPE_CREDENTIALS }}
          # ===== 推送配置 =====
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        run: |
          python main.py

      # 把 state.json 提交回仓库。
      # 双重作用:
      #   1. 保留跨天状态（连续失败计数、凭证首见日期）
      #   2. 保活 — 仓库每天有 commit，不会触发 GitHub「60 天无活动自动禁用 schedule」
      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && echo "state 无变化，跳过提交" && exit 0
          git commit -m "chore: update state $(date -u +%Y-%m-%d)"
          git push

  # 第二道保险。
  # commit 保活靠 state.json 变化，万一某段时间 state 恰好一直不变（或 commit 步骤失败），
  # 这个 job 直接调 GitHub API 重置 60 天计时器，不依赖仓库有无新 commit。
  # 与 wxread 仓库用的是同一方案。
  keepalive:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: checkin
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1

  # 签到失败 → 建 Linear 工单（只在 checkin job 失败时跑）
  # 标题带 run ID 天然幂等；去重由本地自动化处理（同 run 已有工单则跳过）
  notify-linear:
    name: Notify Linear
    if: ${{ failure() }}
    needs: checkin
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create Linear issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_REPO_FULL: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse

          key = os.environ["LINEAR_API_KEY"]
          run_id = os.environ["GH_RUN_ID"]
          run_url = f"{os.environ['GH_SERVER_URL']}/{os.environ['GH_REPO_FULL']}/actions/runs/{run_id}"

          # 先拉本次 run 的日志片段，把失败站点一并写进工单
          failed_sites = "见 run 日志（无法在 runner 内自取，由处理人查）"
          desc = f"""## 签到失败工单（自动生成）

          **仓库**: pommotion/daily-checkin
          **失败 run**: {run_url}
          **失败站点**: {failed_sites}

          ## 处理 SOP（给 ego 执行）
          1. gh run view {run_id} --log -R pommotion/daily-checkin 看失败原因分类：
             - Cookie/JWT 过期（401/登录失效）→ 第 2 步
             - Cloudflare 拦截 + 海豚湾 → 忽略并关单（已迁本地 launchd，GH 侧已禁用）
             - 代码/接口改版 → 只报告，不自行改代码
          2. Cookie 过期修复: ego-browser 打开站点（继承登录态）→ 过人机验证 →
             CDP 读全套 Cookie（含 HttpOnly）→ 重建 curl →
             gh secret set <SECRET> -R pommotion/daily-checkin
             Secret 映射: 海豚湾=HITUN_CURL_BASH, ListenHub会员=LISTENHUB_PRO_CURL_BASH
          3. 修复后触发验证: gh workflow run daily-checkin -R pommotion/daily-checkin --ref main
             60s 后确认新 run success → 本工单标 Done
          4. 卡住（扫码/验证码/付费/改代码）→ 工单加「blocked」标签 + Telegram 告警，交还老板
          """
          desc = desc[:5000]

          query = """
          mutation($title: String!, $desc: String!) {
            issueCreate(input: { title: $title, description: $desc }) {
              success
              issue { id identifier url }
            }
          }"""
          payload = {"query": query,
                     "variables": {"title": f"[daily-checkin] 签到失败 run {run_id}",
                                   "desc": desc}}
          req = urllib.request.Request(
              "https://api.linear.app/graphql",
              data=json.dumps(payload).encode(),
              headers={"Authorization": key, "Content-Type": "application/json"})
          resp = json.load(urllib.request.urlopen(req, timeout=30))
          print("linear resp:", json.dumps(resp, ensure_ascii=False)[:500])
          PYEOF
